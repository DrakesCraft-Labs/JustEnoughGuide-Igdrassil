# Ya sea para registrar el libro de suplementos de recetas
recipe-complete: true

custom-format:
  # Interfaz principal del libro Slime
  # B = tablero de fondo
  # b = devolver
  # T = configuración
  # R = Búsqueda en tiempo real (si la función no está activada, se mostrará en el panel de fondo)）
  # C = Lista de colecciones (se muestra en el panel de fondo si la función no está activada)）
  # S = buscar
  # G = grupo de artículos
  # P = Pagina anterior
  # N = Página siguiente
  main:
    - "BTBBBBRSB"
    - "GGGGGGGGG"
    - "GGGGGGGGG"
    - "GGGGGGGGG"
    - "GGGGGGGGG"
    - "BPBBCBBNB"
  # Interfaz de categoría principal
  # B = tablero de fondo
  # b = devolver
  # R = Búsqueda en tiempo real (si la función no está activada, se mostrará en el panel de fondo)）
  # C = Lista de colecciones (se muestra en el panel de fondo si la función no está activada)）
  # S = buscar
  # G = grupo de artículos
  # P = Pagina anterior
  # N = Página siguiente
  nested-group:
    - "BbBBBBRSB"
    - "GGGGGGGGG"
    - "GGGGGGGGG"
    - "GGGGGGGGG"
    - "GGGGGGGGG"
    - "BPBBCBBNB"
  # Clasificación de artículos
  # B = tablero de fondo
  # b = devolver
  # R = Búsqueda en tiempo real (si la función no está activada, se mostrará en el panel de fondo)）
  # C = Lista de colecciones (se muestra en el panel de fondo si la función no está activada)）
  # c = Elementos recopilados (la función se mostrará en el panel de fondo si la función no está activada)）
  # S = buscar
  # i = cosa
  # P = Pagina anterior
  # N = Página siguiente
  sub-group:
    - "BbBBBBRSB"
    - "iiiiiiiii"
    - "iiiiiiiii"
    - "iiiiiiiii"
    - "iiiiiiiii"
    - "BPBcCBBNB"
  # Visualización de recetas
  # B = tablero de fondo
  # b = devolver
  # R = Búsqueda en tiempo real (si la función no está activada, se mostrará en el panel de fondo)）
  # C = Lista de colecciones (se muestra en el panel de fondo si la función no está activada)）
  # S = buscar
  # r = Material
  # w = Wiki Enlace
  # t = Tipo de receta
  # i = Elementos de salida
  # E = Fórmula extra grande
  # K = SlimeFunRecipe Edición de recetas (si corresponde)）
  recipe:
    - "bK rrr  w"
    - " t rrr i "
    - "m  rrr  E"
  # Visualización de recetas - artículo original
  # B = tablero de fondo
  # b = devolver
  # R = Búsqueda en tiempo real (si la función no está activada, se mostrará en el panel de fondo)）
  # C = Lista de colecciones (se muestra en el panel de fondo si la función no está activada)）
  # S = buscar
  # r = Material
  # w = Wiki Enlace
  # t = Tipo de receta
  # i = Elementos de salida
  # P = Pagina anterior
  # N = Página siguiente
  # m = Rentabilidad (si no hay información de rentabilidad, se mostrará al aire）
  recipe-vanilla:
    - "b  rrr  w"
    - " t rrr i "
    - "   rrr   "
    - "BPBBBBBNB"
  # Visualización de recetas - Elementos de visualización de recetas
  # B = tablero de fondo
  # b = devolver
  # R = Búsqueda en tiempo real (si la función no está activada, se mostrará en el panel de fondo)）
  # C = Lista de colecciones (se muestra en el panel de fondo si la función no está activada)）
  # S = buscar
  # r = Material
  # w = Wiki Enlace
  # t = Tipo de receta
  # i = Elementos de salida
  # E = Fórmula extra grande
  # P = Pagina anterior
  # N = Página siguiente
  # d = Visualización de recetas
  # m = Rentabilidad (si no hay información de rentabilidad, se mostrará al aire）
  # K = SlimeFunRecipe Edición de recetas (si corresponde)）
  recipe-display:
    - "bK rrr  w"
    - " t rrr i "
    - "m  rrr  E"
    - "BPBBBBBNB"
    - "ddddddddd"
    - "ddddddddd"
  # guía de ayuda
  # B = tablero de fondo
  # b = devolver
  # R = Búsqueda en tiempo real (si la función no está activada, se mostrará en el panel de fondo)）
  # C = Lista de colecciones (se muestra en el panel de fondo si la función no está activada)）
  # S = buscar
  # R = búsqueda en tiempo real
  # S = buscar
  # A = Información del autor
  # h = Visualización de funciones
  # P = Pagina anterior
  # N = Página siguiente
  helper:
    - "BbBBBBRSB"
    - "B   A   B"
    - "BhhhhhhhB"
    - "BhhhhhhhB"
    - "BhhhhhhhB"
    - "BPBBCBBNB"
  # configuración
  # B = tablero de fondo
  # b = devolver
  # s = Contribuyente
  # v = Versión
  # u = código fuente
  # W = wiki
  # o = Opciones de guía
  # P = Pagina anterior
  # l = Complementos afiliados
  # z = Consejos para la versión no oficial (la versión oficial muestra el panel de fondo）
  # U = Esta función aún no está disponible
  # N = Página siguiente
  settings:
    - "bBsBvBuBW"
    - "BBBBBBBBB"
    - "BoooooooB"
    - "BoooooooB"
    - "BBBBBBBBB"
    - "BPlBzBUNB"
  # Contribuyente
  # B = tablero de fondo
  # b = devolver
  # p = Contribuyente
  # P = Pagina anterior
  # N = Página siguiente
  contributors:
    - "BbBBBBBBB"
    - "ppppppppp"
    - "ppppppppp"
    - "ppppppppp"
    - "ppppppppp"
    - "BPBBBBBNB"
  # conjunto de encuadernación de llaves
  # B = tablero de fondo
  # b = devolver
  # i = Subconjunto de enlace de teclas
  keybinds:
    - "BbBBBBBBB"
    - "BiiiiiiiB"
    - "BiiiiiiiB"
    - "BiiiiiiiB"
    - "BiiiiiiiB"
    - "BPBBBBBNB"
  # Subconjunto de enlace de teclas
  # B = tablero de fondo
  # b = devolver
  # x = botón original
  # y = divisor
  # z = Claves del mapa
  keybind:
    - "BbBBBBBBB"
    - "BxyzBxyzB"
    - "BxyzBxyzB"
    - "BxyzBxyzB"
    - "BxyzBxyzB"
    - "BPBBBBBNB"
  # Selección de botones
  # B = tablero de fondo
  # b = devolver
  # i = botón
  action-select:
    - "BbBBBBBBB"
    - "iiiiiiiii"
    - "iiiiiiiii"
    - "BPBBBBBNB"


#file: noinspection GrazieInspection
# Auto update from Guizhan Build is enabled by default.
auto-update: true

guide:
  survival-guide-title: "&2&lSlimefun guía (modo de supervivencia)         &e&lel amor viene de JustEnoughGuide"
  cheat-guide-title: "&c&lSlimefun guía (modo trampa)         &e&lel amor viene de JustEnoughGuide"

improvements:
  pinyin-search: true
  bookmark: true
  rts-search: true
  beginner-option: true
  emc-display-option: true
  finaltech-emc-display-option: true
  finalTECH-emc-display-option: true
  item-shareable: true
  cer-patch: false
  allow-action-redirect: true
  logitech-machine-stackable-display: true
  slimefun-id-display: true

# Si se debe prohibir el intercambio de bolsas en contenedores de limo
disable-bundle-interaction: true

# Si interoperar con tarjetas de reemplazo de artículos de diferentes archivos adjuntos
adapt-replacement-cards: true

# Artículos que tienen prohibido producir subproductos. ID
no-replacement-card-companion-item-ids: [ ]

# Prohibición de productos de acompañamiento.
no-replacement-card-companion-addons: [ ]

# Si se debe agregar automáticamente un botón para completar recetas a las máquinas que son compatibles con la finalización de recetas
auto-add-recipe-complete-button: true

# Deshabilite los bloques de limo para que no agreguen automáticamente botones para completar recetas
no-auto-add-recipe-complete-blocks: [ ]

# Deshabilite la adición automática de accesorios de limo para los botones de finalización de recetas
no-auto-add-recipe-complete-addons: [ ]

# Se prohíbe que aparezcan elementos cuyos nombres contengan cualquiera de las siguientes palabras al buscar elementos no calificados
blacklist:
